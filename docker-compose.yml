services:
  fedesconsultora-web:
    image: ${IMAGE_REF:?Set IMAGE_REF to an immutable GHCR tag or digest}
    container_name: fedesconsultora-web
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    env_file:
      - path: ${RUNTIME_ENV_FILE:-.env.production}
        required: ${RUNTIME_ENV_FILE_REQUIRED:-true}
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    expose:
      - "4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - fedes-net

networks:
  fedes-net:
    external: true
